<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="canonical" href="https://cap-cpi.github.io/cap-cpi-site/">
  <title>Cap CPI — nouvelle adresse</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F7F3EA; color: #17150F; font-family: system-ui, -apple-system, sans-serif; }
    main { max-width: 38rem; padding: 2rem; text-align: center; }
    h1 { font-family: Georgia, serif; font-size: 2.4rem; margin: 0 0 .6rem; }
    p { color: #6E6759; line-height: 1.6; }
    a { color: #14584A; font-weight: 600; }
    .box { margin: 1.4rem 0; padding: 1rem 1.2rem; border: 1px solid #E3DAC7; border-radius: 14px; background: #FFFCF6; text-align: start; }
    .box strong { display: block; margin-bottom: .3rem; color: #17150F; }
    button { margin-top: .8rem; padding: .7rem 1.1rem; border: 0; border-radius: 999px; background: #14584A; color: #fff; font-weight: 600; cursor: pointer; }
    .small { font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <h1>Cap CPI</h1>
    <p>L'application a déménagé vers<br>
      <a href="https://cap-cpi.github.io/cap-cpi-site/">cap-cpi.github.io/cap-cpi-site</a>
    </p>

    <div id="migration" class="box" hidden>
      <strong>Une progression locale a été détectée sur cette ancienne adresse.</strong>
      <p class="small">Téléchargez votre sauvegarde, ouvrez la nouvelle adresse, puis importez le fichier dans <em>Réglages → Importer</em>.</p>
      <button id="download" type="button">Télécharger ma sauvegarde</button>
    </div>

    <p><a id="continue" href="https://cap-cpi.github.io/cap-cpi-site/">Continuer vers la nouvelle adresse →</a></p>
  </main>

  <script>
    (function () {
      var NEW_URL = 'https://cap-cpi.github.io/cap-cpi-site/';
      var PROFILE_KEY = 'capcpi.profile.v1';
      var PROGRESS_KEY = 'capcpi.progress.v1';

      function go() {
        window.location.replace(NEW_URL);
      }

      try {
        var profile = localStorage.getItem(PROFILE_KEY);
        var progress = localStorage.getItem(PROGRESS_KEY);

        if (!profile || !progress) {
          window.setTimeout(go, 900);
          return;
        }

        document.getElementById('migration').hidden = false;
        document.getElementById('download').addEventListener('click', function () {
          var payload = {
            version: 1,
            exportedAt: new Date().toISOString(),
            profile: JSON.parse(profile),
            progress: JSON.parse(progress)
          };
          var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
          var url = URL.createObjectURL(blob);
          var link = document.createElement('a');
          link.href = url;
          link.download = 'cap-cpi-sauvegarde.json';
          document.body.appendChild(link);
          link.click();
          link.remove();
          URL.revokeObjectURL(url);
        });
      } catch (error) {
        window.setTimeout(go, 900);
      }
    })();
  </script>
</body>
</html>
